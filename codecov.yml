comment:
    layout: "condensed_header, diff, condensed_files, condensed_footer"
    hide_project_coverage: false
    # Post on every PR, including ones whose diff touches no measured line, so a PR
    # that drops coverage without changing Python still shows it.
    require_changes: false

# Mirrors the `omit` list in pyproject.toml so an upload produced without that config
# (a local run, a new workflow) still reports the same set of files.
ignore:
    - "**/migrations/**"
    - "**/tests/**"
    - "**/test_*.py"
    - "**/conftest.py"
    - "apps/utils/factories/**"
    - "config/settings_production.py"
    - "scripts/**"
    - "tasks.py"
    - "manage.py"

coverage:
    # Both checks are informational until a few PRs have reported against the
    # measured-source baseline. Drop `informational` to make them block PRs.
    status:
        patch:
            default:
                # New/changed lines in each PR should be at least 80% covered.
                # The threshold allows small PRs where one uncovered line would fail an exact target.
                target: 80%
                threshold: 5%
                informational: true
        project:
            default:
                # Don't regress below the current project total.
                target: auto
                threshold: 1%
                informational: true
