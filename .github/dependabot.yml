version: 2

# A note on `cooldown`: it delays *version* update PRs so a freshly published
# release has time to be found malicious and unpublished before we adopt it.
# It deliberately does not apply to Dependabot *security* updates, so advisory
# fixes still land immediately. The npm ecosystems are additionally floored by
# `minimumReleaseAge` in pnpm-workspace.yaml, which catches transitive bumps
# that Dependabot never opens a PR for. uv has a client-side equivalent
# (`tool.uv.exclude-newer` in pyproject.toml) that we don't currently set;
# actions and pre-commit have no such lever, so cooldown is the only guard
# there.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      # Babel 7 and 8 packages cannot be mixed, so a major bump of one
      # @babel/* package on its own never works. Babel 8 has to be a manual
      # migration of all of them together.
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/components/chat_widget"
    open-pull-requests-limit: 5
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      # Stencil 4's integrated test runner only supports Jest 29. Remove once
      # the Stencil 5 migration (#3954) moves the spec tests off Jest.
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest-cli"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "uv"
    directory: "/"
    open-pull-requests-limit: 5
    schedule:
      interval: "monthly"
    # Only touch pyproject.toml when the new version falls outside the declared
    # constraint (e.g. pinned or capped deps). Otherwise update uv.lock alone,
    # so floors stay at the version we actually need rather than ratcheting to
    # the latest release and needlessly narrowing the resolver's options.
    versioning-strategy: "increase-if-necessary"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
