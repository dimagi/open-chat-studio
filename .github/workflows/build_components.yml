name: Build Components
on:
  pull_request:
    paths:
      - 'components/**'
  push:
    branches:
      - main
    paths:
      - 'components/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      # Audit only: records egress without blocking. Flip to `block` plus an
      # `allowed-endpoints` list once the recorded traffic looks stable.
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: components/chat_widget/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./components/chat_widget
      - name: Test
        run: pnpm run test
        working-directory: ./components/chat_widget
      - name: Test security
        run: pnpm run test:security
        working-directory: ./components/chat_widget
      - name: Build
        run: pnpm run build
        working-directory: ./components/chat_widget
