# Docs and Changelog Dispatch Workflow
#
# Tells the docs repo (dimagi/open-chat-studio-docs) to draft a changelog entry
# and docs update for a merged PR. Sends a `repository_dispatch` event
# (`ocs_changelog_update`) only when the PR description has the "This PR
# requires docs/changelog update" checkbox ticked. The docs repo's
# update-changelog.yml does the rest.
#
# Triggered on: pull_request closed against `main` with changes under
# components/, config/, assets/, apps/ or templates/; the job runs only when the
# PR was merged and its description contains `[x]` (a cheap filter)
#
# Requirements: OCS_DOCS_PAT secret (token that can dispatch to the docs repo)
#
# Notes:
# - The "Self-hosted operators must know about or act on this change" checkbox
#   does not trigger a dispatch; operator entries go in CHANGELOG.md by hand.
# - PRs that only change files outside the listed paths (e.g. tech docs) do not
#   trigger it.
# - Re-run those manually from the docs repo's workflow_dispatch.
#
# See https://developers.openchatstudio.com/developer_guides/user_docs/changelog_automation/
# for the full pipeline.

name: Docs and Changelog Dispatch

on:
  pull_request:
    types: [closed]
    branches:
      - main
    paths:
      - 'components/**'
      - 'config/**'
      - 'assets/**'
      - 'apps/**'
      - 'templates/**'

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch Docs and Changelog Update
    # Only run if the PR was merged (not just closed) and has a ticked checkbox
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.body, '[x]')
    runs-on: ubuntu-latest

    steps:
      # Audit only: records egress without blocking. Flip to `block` plus an
      # `allowed-endpoints` list once the recorded traffic looks stable.
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check if docs/changelog update is needed
        id: check_docs_needed
        run: |
          # Check for specific checked checkbox indicating docs/changelog update needed
          # Looks for: - [x] This PR requires docs/changelog update
          if printf '%s\n' "$PR_BODY" | grep -qiE -- '- \[[xX]\].*[Rr]equires (docs|changelog|documentation)'; then
            echo "needs_docs_update=true" >> "$GITHUB_OUTPUT"
            echo "PR indicates docs/changelog update is needed"
          else
            echo "needs_docs_update=false" >> "$GITHUB_OUTPUT"
            echo "No docs/changelog update needed (checkbox not checked)"
          fi
        env:
          PR_BODY: ${{ github.event.pull_request.body }}

      - name: Check if widget files changed
        id: check_widget
        if: steps.check_docs_needed.outputs.needs_docs_update == 'true'
        run: |
          # Get list of changed files in this PR
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json files --jq '.files[].path' > /tmp/changed_files.txt

          # Check if any files in components/ folder were changed
          if grep -q "^components/" /tmp/changed_files.txt; then
            echo "is_widget_change=true" >> "$GITHUB_OUTPUT"
            echo "Widget files were changed"
          else
            echo "is_widget_change=false" >> "$GITHUB_OUTPUT"
            echo "No widget files changed"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Repository Dispatch
        if: steps.check_docs_needed.outputs.needs_docs_update == 'true'
        uses: peter-evans/repository-dispatch@v4.0.1
        with:
          token: ${{ secrets.OCS_DOCS_PAT }}
          repository: dimagi/open-chat-studio-docs
          event-type: ocs_changelog_update
          client-payload: |
            {
              "pr_number": ${{ github.event.pull_request.number }},
              "pr_title": ${{ toJSON(github.event.pull_request.title) }},
              "pr_body": ${{ toJSON(github.event.pull_request.body) }},
              "pr_url": "${{ github.event.pull_request.html_url }}",
              "pr_author": "${{ github.event.pull_request.user.login }}",
              "is_widget_change": ${{ steps.check_widget.outputs.is_widget_change }},
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "repository": "${{ github.repository }}"
            }
