# PR Prerequisites
#
# Fails a pull request until every PR listed in its "Prerequisite PRs" section is in a
# `v*` release tag, using `scripts/check_prerequisite_releases.py`. A prerequisite is a
# merged PR whose manual steps (for example a data migration command) must run on a
# deployment before this PR can ship.
#
# Triggered on: PR opened, reopened, pushed or edited; a `v*` tag pushed
# Requirements: none beyond the default GITHUB_TOKEN
#
# Notes:
# - The script is read from the default branch, never from the PR, so a PR cannot
#   change the script it is judged by. See `pr_risk_label.yml` for why the default
#   branch rather than the PR's `base.sha`. This workflow file itself still runs
#   from the PR, so a reviewer must catch edits to it
# - The script fetches the PR description through the API instead of reading the event
#   payload, because a re-run replays the original payload and would miss later edits
# - A `v*` tag push re-runs the check on each open PR whose latest run finished
#   unsuccessfully, so PRs waiting on that release turn green without anyone touching
#   them. GitHub cannot re-run a workflow run older than 30 days; such a PR needs a
#   push or an edit

name: PR Prerequisites

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  push:
    tags: ['v*']

# Keyed on the head commit too, so a re-run of an older commit's check cannot cancel
# the check on the PR's current commit.
concurrency:
  group: pr-prerequisites-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: Prerequisite PRs released
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # Full history and tags: the check is `git tag --contains <merge commit>`.
      - name: Check out the script from the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          sparse-checkout: scripts/check_prerequisite_releases.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Check prerequisites
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [[ ! -f scripts/check_prerequisite_releases.py ]]; then
            echo "::error::scripts/check_prerequisite_releases.py is missing from the default branch." \
                 "A pull request that adds or renames it cannot be checked by it."
            exit 1
          fi
          python3 scripts/check_prerequisite_releases.py --repo "$REPO" --pr "$PR"

  recheck:
    name: Re-run failed checks after a release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Re-run failed checks on open PRs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr list --state open --limit 1000 --json number,headRefOid \
            --jq '.[] | "\(.number) \(.headRefOid)"' |
          while read -r number sha; do
            run=$(gh run list --workflow pr_prerequisites.yml --event pull_request --commit "$sha" \
                    --limit 1 --json databaseId,status,conclusion \
                    --jq '.[] | select(.status == "completed" and .conclusion != "success") | .databaseId')
            if [[ -n "$run" ]]; then
              echo "Re-running the check for #$number (run $run)"
              gh run rerun "$run" || echo "::warning::Could not re-run the check for #$number (run $run)"
            fi
          done
