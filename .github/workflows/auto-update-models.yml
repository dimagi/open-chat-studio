# Auto Update LLM Models Workflow
#
# Daily reconciliation of the in-repo model catalogue and pricing seed against
# LiteLLM's model_prices_and_context_window.json, which carries pricing, token
# limits, provider, model kind and deprecation dates for ~3900 models and needs
# no credentials.
#
# scripts/auto_sync_models is a six-layer pipeline: our catalogue and the
# LiteLLM table are read into the same shape, and every signal below falls out
# of one comparison between them.
#
#   added       upstream has it, we do not, we never deleted it, and we have
#               not rejected it (so anything still undecided is still here)
#   deprecated  we still list it as active, its upstream end-of-life has passed
#   repriced    a rate we hold has moved upstream
#   backfilled  a rate we lack and upstream has
#   unpriced    still uncostable after backfill
#   removed     we list it, LiteLLM no longer does at all (report only)
#
# Job 1 (reconcile) runs the script. The pricing side effects (rewrite seed +
# emit migration) are mechanical, so the same job opens the "Pricing update" PR
# and the "missing pricing" issue. Job 2 (catalogue-pr) runs when there are new
# or newly-deprecated models and invokes Claude Code for the judgement calls,
# per docs/developer_guides/managing_models.md.
#
# Discovery has one memory: scripts/auto_sync_models/model_ledger.json, keyed
# "provider/model". It holds the models we have seen upstream and not
# registered -- each with a first_seen date, a verdict, the parameter-relevant
# capability flags LiteLLM reports for it, and a reason once rejected.
#
# `added` subtracts only the rejected keys, so a model stays on offer until it
# has a verdict and a failed run strands nothing. Job 2 closes each one out:
# rejecting sets the verdict and a reason, registering deletes the entry --
# default_models.py is then the record that we serve it, and a second copy in
# the ledger would only drift from it.
#
# Triggered on: daily schedule, or manual dispatch
# Requirements: ANTHROPIC_API_KEY secret (job 2). Job 1 needs no credentials
#   beyond GITHUB_TOKEN for opening the PR and issue — the upstream file is
#   public and the script makes exactly one unauthenticated request.
#
# Notes:
# - The catalogue PR (job 2) gets the `claude` and `auto-models` labels.
# - The missing-pricing issue (job 1) gets `cost-tracking` and `auto-models`.
# - Both jobs skip rather than stack when their own PR is already open.
# - Uses a single global concurrency group, so only one run of the whole
#   workflow executes at a time across the repository.

name: Auto Update LLM Models

on:
  schedule:
    - cron: '0 4 * * *'  # Daily at 04:00 UTC
  workflow_dispatch:

concurrency:
  group: auto-update-models
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    timeout-minutes: 30
    outputs:
      has_catalogue_work: ${{ steps.reconcile.outputs.has_catalogue_work }}
      new_model_count: ${{ steps.reconcile.outputs.new_model_count }}
      new_model_ids: ${{ steps.reconcile.outputs.new_model_ids }}
      deprecated_count: ${{ steps.reconcile.outputs.deprecated_count }}
    steps:
      # Audit only: records egress without blocking. Flip to `block` plus an
      # `allowed-endpoints` list once the recorded traffic looks stable.
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Reconcile upstream model catalogue and pricing seed
        id: reconcile
        run: |
          # Stdlib-only - no dependency install needed.
          python3 -m scripts.auto_sync_models.sync --output reconciliation.json

      - name: Upload reconciliation payload
        if: steps.reconcile.outputs.has_catalogue_work == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reconciliation-payload
          path: |
            reconciliation.json
          retention-days: 7

      - name: Check for an open pricing PR
        id: open_pricing_pr
        if: steps.reconcile.outputs.has_price_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The seed on main is unchanged while an earlier pricing PR sits
          # unmerged, so this run recomputes the same deltas. Skip rather than
          # open a second, near-identical PR.
          EXISTING=$(gh pr list --state open --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("auto-pricing/"))] | .[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Pricing PR #${EXISTING} is still open; skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit, push, and open Pricing update PR
        if: steps.open_pricing_pr.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ steps.reconcile.outputs.pricing_pr_title }}
          PR_BODY_PATH: ${{ steps.reconcile.outputs.pricing_pr_body_path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="auto-pricing/$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add apps/cost_tracking/seed_data/llm_pricing.json apps/cost_tracking/migrations/
          git commit -m "$PR_TITLE"
          git push -u origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$PR_TITLE" \
            --body-file "$PR_BODY_PATH"

      - name: Open or update missing-pricing issue
        if: steps.reconcile.outputs.has_missing_pricing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY_PATH: ${{ steps.reconcile.outputs.missing_pricing_issue_body_path }}
          MISSING_COUNT: ${{ steps.reconcile.outputs.missing_pricing_count }}
        run: |
          # One open issue at a time. Edit it if it already exists so the body
          # reflects the latest gap list; otherwise open a new one. Body is
          # prefixed with a team @-mention so the platform team is notified.
          TITLE="Missing pricing for ${MISSING_COUNT} OCS-managed model(s)"
          {
            echo "cc @dimagi/open-chat-studio"
            echo
            cat "$ISSUE_BODY_PATH"
          } > issue-body.md
          EXISTING=$(gh issue list \
            --state open \
            --label cost-tracking \
            --search "Missing pricing for in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body-file issue-body.md
          else
            gh issue create \
              --title "$TITLE" \
              --body-file issue-body.md \
              --label cost-tracking \
              --label auto-models
          fi

  catalogue-pr:
    needs: reconcile
    if: needs.reconcile.outputs.has_catalogue_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      DJANGO_DATABASE_USER: postgres
      DJANGO_DATABASE_PASSWORD: postgres_password
      SECRET_KEY: secret-test-key
    steps:
      # Audit only: records egress without blocking. Flip to `block` plus an
      # `allowed-endpoints` list once the recorded traffic looks stable.
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for an open catalogue PR
        id: open_catalogue_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The ledger advances only when a PR merges, so the same models are
          # re-offered while one sits open. Skip rather than stack a second PR.
          EXISTING=$(gh pr list --state open --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("auto-models/"))] | .[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Catalogue PR #${EXISTING} is still open; skipping this run."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download reconciliation payload
        if: steps.open_catalogue_pr.outputs.proceed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: reconciliation-payload

      - name: Set up Python
        if: steps.open_catalogue_pr.outputs.proceed == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up uv
        if: steps.open_catalogue_pr.outputs.proceed == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python dependencies
        if: steps.open_catalogue_pr.outputs.proceed == 'true'
        run: |
          uv venv
          uv sync --locked --dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - uses: pnpm/action-setup@v6.0.10
        if: steps.open_catalogue_pr.outputs.proceed == 'true'

      - name: Set up Node.js
        if: steps.open_catalogue_pr.outputs.proceed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install Node dependencies
        if: steps.open_catalogue_pr.outputs.proceed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Create branch
        id: branch
        if: steps.open_catalogue_pr.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH_NAME="auto-models/$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: claude
        if: steps.open_catalogue_pr.outputs.proceed == 'true'
        uses: anthropics/claude-code-action@v1.0.206
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are adding newly released LLM models to Open Chat Studio.

            ## Input
            `scripts/auto_sync_models` has already read the LiteLLM price
            table, translated it into OCS's own shape, and compared the two.
            Its output is at `./reconciliation.json`. Do NOT re-fetch,
            re-translate or re-derive pricing — that work is done and
            unit-tested. You care about `added[]` and `deprecated[]` only; the
            `repriced`, `backfilled` and `unpriced` sections are handled in a
            separate job and are not your concern.

            Each entry is one **(provider, model) pair**, not a model with a
            list of providers. A model served by both openai and azure appears
            as two entries, each with that provider's own rates and limit.

            - `added[]` — candidates to consider. Fields: `provider`, `model`,
              `token_limit` (that provider's context window, may be null),
              `params` (what the model supports, for choosing a parameters
              class — see step 3), `rates` (per-1K-token prices keyed by service
              kind, may be empty), `deprecation_date`, `litellm_key` (the
              upstream key it came from), and `pricing_entry` — a ready-to-paste
              `llm_pricing.json` entry, or null when LiteLLM had no rates.
            - `deprecated[]` — models we still list as active whose upstream
              deprecation date has passed. This can be non-empty on a run with
              no new models at all, which is reason enough to open a PR.
            - `removed[]` — models we list that LiteLLM no longer lists at all.
              **Informational only. Do not act on these.** A key disappearing
              upstream is weak evidence a provider retired the model, and OCS
              deliberately keeps deprecated models registered so existing
              chatbots keep working. Mention them in the report, change nothing.

            ${{ needs.reconcile.outputs.new_model_count }} new (provider, model)
            pair(s): ${{ needs.reconcile.outputs.new_model_ids }}
            ${{ needs.reconcile.outputs.deprecated_count }} model(s) past their
            upstream deprecation date.

            ## The ledger — read this before you start
            `scripts/auto_sync_models/model_ledger.json` records the models we
            have seen upstream and have not registered. The script has already
            written each `added` entry into it with `"verdict": "pending"`.

            Only a `rejected` verdict takes a model off the list, so anything
            you leave pending comes back on the next run rather than being
            lost. Still, close out every `added` entry in this same PR:
            - decided against it -> set `"verdict": "rejected"` plus a one-line
              `"reason"`. It is never offered again.
            - registered it -> **delete its entry**. `default_models.py` is the
              record that OCS serves the model; a second copy of that fact in
              the ledger would only drift from it.

            ## Your task
            1. Read `reconciliation.json`,
               `apps/service_providers/llm_service/default_models.py`, and
               `scripts/auto_sync_models/model_ledger.json`.
            2. For each entry in `added`, decide whether to register it:
               - Skip models that make no sense for OCS as a chatbot: embedding-
                 or image-only, audio/realtime/transcription variants, guard and
                 safety classifiers, robotics or domain models, and preview
                 models already superseded by a release.
               - Skip dated snapshot aliases (`gpt-5.4-2026-03-05`,
                 `claude-opus-4-7-20260416`) when OCS already registers the
                 undated name — they are the same model under a pinned label.
               - `provider` comes from LiteLLM's tagging. It is usually right
                 but it is still upstream metadata: check that provider really
                 serves the model under that exact name before registering it.
               - Record every decision in the ledger as described above.
            3. Follow `docs/developer_guides/managing_models.md` exactly when
               adding:
               - Register it in `DEFAULT_LLM_PROVIDER_MODELS` under its own
                 provider, using that entry's own `token_limit`. Resellers
                 differ — Azure serves gpt-5-pro at 272k where OpenAI serves
                 400k — so never reuse one provider's number for another.
               - Pick the parameters class from that entry's `params`:
                 `reasoning` says whether an `effort` field applies at all;
                 `effort_levels` lists the levels the model accepts (low,
                 medium and high are the unflagged baseline, so they are not
                 listed); `adaptive_thinking` maps to the field of that name;
                 and `sampling: false` means the model refuses `temperature`,
                 so its class must not declare one. Match an existing class;
                 only create one if none fits. An absent or empty `params`
                 means LiteLLM reported nothing, not that the model supports
                 nothing.
               - Create a new Django migration that calls `llm_model_migration()`.
               - Strip `llm_model_migration()` (and any `notify_deprecated_models`
                 / `remove_deprecated_models` data migrations) from earlier
                 migrations in `apps/service_providers/migrations/` so they only
                 run once.
            4. For each entry in `deprecated[]`, mark that model
               `deprecated=True` in `default_models.py` if it isn't already, and
               set `replacement=` where an obvious successor exists. If the file
               already marks it, leave it alone and say so in the report.
            5. Apply pricing: for each model you register, append its
               `pricing_entry` to `apps/cost_tracking/seed_data/llm_pricing.json`
               verbatim. Each entry already carries its own provider's rates — do
               not merge or share rates between providers. Trust the unit
               conversion but sanity-check the magnitudes. Do NOT invent prices:
               an entry whose `pricing_entry` is null goes under
               `## Needs follow-up` instead. After editing, confirm the file is
               still valid JSON.
            6. If an entry's `token_limit` is null, LiteLLM had no context window
               for it — consult the LiteLLM price table with WebFetch, or use
               what you know about the family. If you still cannot determine it,
               register it with a conservative placeholder (e.g. 128000) and a
               `# TODO: verify token_limit` comment, and flag it under
               `## Needs follow-up`.
            7. Lint and test the changed files:
               - `uv run ruff check apps/ --fix`
               - `uv run ruff format apps/service_providers/ apps/cost_tracking/`
               - `uv run pytest apps/service_providers/tests/test_default_models.py -v`
               Lint/test any other files your migration touched.
            8. Commit the changes. The commit MUST include
               `scripts/auto_sync_models/model_ledger.json` — without it the
               verdicts are lost and every model you just judged is re-offered.
            9. Push the branch and open a PR against `main` using the repo's PR
               template (`.github/pull_request_template.md`).
               - PR title: `Auto: update LLM model catalogue (YYYY-MM-DD)`
                 (today's UTC date).
               - The PR description MUST:
                 * List each registered model with its provider and token limit.
                 * Include the line: `Model metadata, pricing and token limits
                   from the
                   [LiteLLM price table](https://github.com/BerriAI/litellm/blob/main/model_prices_and_context_window.json).`
                 * Include a `## Needs follow-up` section for anything unpriced
                   or missing a token limit.
                 * Check the "The migrations are backwards compatible" box —
                   `llm_model_migration()` is additive (only seeds new rows) so
                   these migrations are inherently backwards-compatible.
            10. Apply the `claude` and `auto-models` labels to the PR if they exist.
            11. If after review there is nothing to register and nothing to
                deprecate, do NOT open an empty PR — but you must still commit
                and push the ledger verdicts, since those rejections are the
                whole value of the run. Open a PR containing only the ledger
                change in that case.
            12. ALWAYS write a decision report to `./decision_report.md` before
                exiting, regardless of outcome. Use this exact structure:

                ```markdown
                # Auto Update Models - Decision Report

                **Run date (UTC):** <YYYY-MM-DD HH:MM>
                **Candidates considered:** <count>
                **Outcome:** <PR opened | Nothing to add | Error>
                **PR:** <PR URL if opened, else "n/a">

                ## Per-model decisions

                ### `<provider>/<model>`
                - **Verdict:** Registered | Rejected | Needs follow-up
                - **Token limit:** <value, or "placeholder - needs verifying">
                - **Pricing:** <applied | none available>
                - **Reason:** <one-sentence rationale>
                - **Ledger verdict set:** <registered | rejected>
                - **Source key:** <litellm_key>

                <repeat for every entry in added>

                ## Deprecations
                <one line per deprecated[] entry: model, date, what you did>

                ## Removed upstream (no action taken)
                <one line per removed[] entry>

                ## Notes
                <sources consulted, edge cases, anything deferred>
                ```

                Every entry in `added` MUST appear under "Per-model decisions"
                with an explicit verdict and reason. This file is the audit
                trail for the run.

            Branch: ${{ steps.branch.outputs.branch_name }} (already created and
            checked out).
          claude_args: |
            --allowedTools "Bash(uv run:*),Bash(uv sync:*),Bash(python manage.py:*),Bash(pnpm run lint:*),Bash(ls:*),Bash(cat:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git checkout:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(gh pr create:*),Bash(gh pr edit:*),Bash(gh label:*),Read,Write,Edit,Glob,Grep,WebFetch"

      - name: Append decision report to step summary
        if: always()
        run: |
          if [ -f decision_report.md ]; then
            cat decision_report.md >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.open_catalogue_pr.outputs.proceed }}" != "true" ]; then
            {
              echo "# Auto Update Models - Decision Report"
              echo ""
              echo "**Skipped.** An \`auto-models/*\` PR is already open. The ledger"
              echo "advances only on merge, so these candidates will be re-offered"
              echo "on the next run once that PR lands."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# Auto Update Models - Decision Report"
              echo ""
              echo "**No decision report was produced.** Claude Code exited without"
              echo "writing \`decision_report.md\`. Check the Claude step logs above"
              echo "for what happened."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
