# Auto Update LLM Models Workflow
#
# Daily reconciliation of the in-repo model catalogue and pricing seed against
# LiteLLM's model_prices_and_context_window.json, which carries pricing, token
# limits, provider, model kind and deprecation dates for ~3900 models and needs
# no credentials. scripts/reconcile_models.py produces four signals:
#
#   - new_models      candidates not yet registered in OCS
#   - price_changes   existing seed entries whose upstream rate has moved
#   - missing_pricing OCS-managed (default_models) models with no seed entry
#   - deprecated_upstream  active OCS models past their upstream end-of-life
#
# Job 1 (reconcile) runs the script. The price-change side effects (rewrite
# seed + emit migration) are deterministic, so the same job opens the
# "Pricing update" PR and the "missing pricing" issue. Job 2 (new-models-pr)
# runs when there are candidates or expired models, and invokes Claude Code for
# the judgement calls (which providers, which params class, deprecations) per
# docs/developer_guides/managing_models.md.
#
# Discovery works by diffing the price table against its own git history: a
# key present today and absent a week ago is newly published. Candidates are
# still selected by state (upstream has it, OCS does not), so a run that fails
# - or a model missed while it was broken - heals on the next run.
#
# Triggered on: daily schedule, or manual dispatch
# Requirements: ANTHROPIC_API_KEY secret (job 2, new-models-pr). Job 1 needs no
#   credentials - both upstream files are public.
#
# Notes:
# - The new-model PR (job 2) gets the `claude` and `auto-models` labels.
# - The missing-pricing issue (job 1) gets the `cost-tracking` and
#   `auto-models` labels.
# - Uses a single global concurrency group (not per-issue/PR), so only one
#   run of the whole workflow — scheduled or manual — executes at a time
#   across the repository.

name: Auto Update LLM Models

on:
  schedule:
    - cron: '0 4 * * *'  # Daily at 04:00 UTC
  workflow_dispatch:

concurrency:
  group: auto-update-models
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    timeout-minutes: 30
    outputs:
      has_new_models: ${{ steps.reconcile.outputs.has_new_models }}
      new_model_count: ${{ steps.reconcile.outputs.new_model_count }}
      new_model_ids: ${{ steps.reconcile.outputs.new_model_ids }}
      has_deprecated_upstream: ${{ steps.reconcile.outputs.has_deprecated_upstream }}
      deprecated_upstream_count: ${{ steps.reconcile.outputs.deprecated_upstream_count }}
    steps:
      # Audit only: records egress without blocking. Flip to `block` plus an
      # `allowed-endpoints` list once the recorded traffic looks stable.
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Reconcile upstream model catalogue and pricing seed
        id: reconcile
        env:
          # Lifts the commit lookup off the 60-per-hour unauthenticated limit
          # that every job sharing the runner's IP draws on.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Stdlib-only - no dependency install needed.
          python3 scripts/reconcile_models.py --output reconciliation.json

      - name: Upload reconciliation payload
        if: steps.reconcile.outputs.has_new_models == 'true' || steps.reconcile.outputs.has_deprecated_upstream == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reconciliation-payload
          path: |
            reconciliation.json
          retention-days: 7

      - name: Configure git author
        if: steps.reconcile.outputs.has_price_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit, push, and open Pricing update PR
        if: steps.reconcile.outputs.has_price_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ steps.reconcile.outputs.pricing_pr_title }}
          PR_BODY_PATH: ${{ steps.reconcile.outputs.pricing_pr_body_path }}
        run: |
          BRANCH="auto-pricing/$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add apps/cost_tracking/seed_data/llm_pricing.json apps/cost_tracking/migrations/
          git commit -m "$PR_TITLE"
          git push -u origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$PR_TITLE" \
            --body-file "$PR_BODY_PATH"

      - name: Open or update missing-pricing issue
        if: steps.reconcile.outputs.has_missing_pricing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY_PATH: ${{ steps.reconcile.outputs.missing_pricing_issue_body_path }}
          MISSING_COUNT: ${{ steps.reconcile.outputs.missing_pricing_count }}
        run: |
          # One open issue at a time. Edit it if it already exists so the body
          # reflects the latest gap list; otherwise open a new one. Labelled
          # `cost-tracking,auto-models` so it filters cleanly. Body is
          # prefixed with a team @-mention so the platform team is notified.
          TITLE="Missing pricing for ${MISSING_COUNT} OCS-managed model(s)"
          {
            echo "cc @dimagi/open-chat-studio"
            echo
            cat "$ISSUE_BODY_PATH"
          } > issue-body.md
          EXISTING=$(gh issue list \
            --state open \
            --label cost-tracking \
            --search "Missing pricing for in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body-file issue-body.md
          else
            gh issue create \
              --title "$TITLE" \
              --body-file issue-body.md \
              --label cost-tracking \
              --label auto-models
          fi

  new-models-pr:
    needs: reconcile
    if: needs.reconcile.outputs.has_new_models == 'true' || needs.reconcile.outputs.has_deprecated_upstream == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      DJANGO_DATABASE_USER: postgres
      DJANGO_DATABASE_PASSWORD: postgres_password
      SECRET_KEY: secret-test-key
    steps:
      # Audit only: records egress without blocking. Flip to `block` plus an
      # `allowed-endpoints` list once the recorded traffic looks stable.
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download reconciliation payload
        uses: actions/download-artifact@v8
        with:
          name: reconciliation-payload

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: |
          uv venv
          uv sync --locked --dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - uses: pnpm/action-setup@v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create branch
        id: branch
        run: |
          BRANCH_NAME="auto-models/$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1.0.206
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are adding newly released LLM models to Open Chat Studio.

            ## Input
            `scripts/reconcile_models.py` has already read the LiteLLM price
            table, removed models already registered in OCS, and resolved
            per-1K-token pricing and token limits. Its output is at
            `./reconciliation.json`. Do NOT re-fetch, re-dedup, or re-derive
            pricing - that work is done and unit-tested. You only care about
            the `new_models[]` and `deprecated_upstream[]` sections here; the
            `price_changes` and `missing_pricing` sections are handled in a
            separate job and are not your concern.

            Candidates are selected by state, not by date: anything upstream
            that OCS has not registered is eligible, with recently-published
            models offered first and the rest capped into `backlog`. Key fields:
            - `new_models[]` - candidates to consider. Each has: `id`,
              `token_limit_by_provider` (context window per provider, from
              LiteLLM; a value may be null), `recently_published`
              (null when the upstream history could not be read),
              `deprecation_date`, `ocs_providers` (the providers LiteLLM tags
              as serving this model), `already_registered_providers`,
              `already_priced_providers`, `source_url`, and `pricing`.
            - `pricing.has_pricing` / `pricing.source` (`litellm`) /
              `pricing.rates_by_provider` - per-1K-token rates keyed by
              provider, because a reseller charges its own rate and Azure's
              differs from OpenAI's for the same model.
            - `pricing.unpriced_providers` - providers serving the model that
              LiteLLM had no rate for. Never copy another provider's rate
              across; these go under `## Needs follow-up`.
            - `pricing.llm_pricing_entries` - ready-to-paste
              `llm_pricing.json` entries, one per provider that still needs
              pricing, each already carrying that provider's own rates.
            - `pricing_entries` - flat list of all generated pricing entries.
            - `unpriced_models[]` - models the script could not price at all.
            - `backlog[]` - unregistered models that did not fit this run's cap.
              Not your concern; the next run will surface them.
            - `deprecated_upstream[]` - models OCS still lists as active whose
              upstream deprecation date has passed. This list can be non-empty
              on a run with no new models at all, which is reason enough to
              open a PR.

            ${{ needs.reconcile.outputs.new_model_count }} new model(s):
            ${{ needs.reconcile.outputs.new_model_ids }}
            ${{ needs.reconcile.outputs.deprecated_upstream_count }} model(s)
            past their upstream deprecation date.

            ## Your task (judgement + applying the generated output)
            1. Read `reconciliation.json` and
               `apps/service_providers/llm_service/default_models.py`.
            2. For each model in `new_models`, decide whether to add it:
               - Skip models that don't make sense for OCS (embedding-only,
                 image-only, or preview models already superseded).
               - `ocs_providers` comes from LiteLLM's provider tagging. It is
                 usually right but it is still upstream metadata: check each
                 provider actually serves the model under that exact name
                 before registering it, and drop any that doesn't. Skip any
                 provider already in `already_registered_providers`.
               - When you deliberately skip a model, append it to
                 `scripts/reconcile_ignored_models.json` as
                 `{"provider_type": ..., "model_name": ..., "reason": ...}`.
                 Candidates are selected by state, so a skip you don't record
                 is re-offered on every future run and holds a slot ahead of
                 the backlog. Record it once, in the same PR.
            3. Follow `docs/developer_guides/managing_models.md` exactly when adding:
               - Register it in `DEFAULT_LLM_PROVIDER_MODELS` using that
                 provider's own entry in `token_limit_by_provider`. The limit
                 lives on each provider's `Model(...)`, and resellers differ -
                 Azure serves gpt-5-pro at 272k where OpenAI serves 400k - so
                 do not reuse one provider's number for another.
               - Pick an existing parameters class that matches the model family;
                 only create a new one if none fits.
               - Create a new Django migration that calls `llm_model_migration()`.
               - Strip `llm_model_migration()` (and any `notify_deprecated_models` /
                 `remove_deprecated_models` data migrations) from earlier migrations
                 in `apps/service_providers/migrations/` so they only run once.
            4. For each entry in `deprecated_upstream[]`, mark that model
               `deprecated=True` in `default_models.py` if it isn't already,
               and set `replacement=` where an obvious successor exists. If the
               file already marks it, leave it alone and say so in the report.
            5. Apply pricing: for each model you add, append its
               `pricing.llm_pricing_entries` to
               `apps/cost_tracking/seed_data/llm_pricing.json`, keeping only the
               providers you actually registered. Each entry already carries its
               own provider's rates - do not merge or share rates between
               providers. Trust the unit conversion but sanity-check the
               magnitudes. Do NOT invent prices: any model in `unpriced_models`,
               and any provider in `pricing.unpriced_providers`, goes under
               `## Needs follow-up` instead. After editing, confirm the file is
               still valid JSON.
            6. If a provider's `token_limit_by_provider` value is null, LiteLLM
               had no context window for it - consult `source_url` with WebFetch,
               or use what you know about the family. If you still can't
               determine it, add the model with a conservative placeholder
               (e.g. 128000) and a `# TODO: verify token_limit` comment, and flag
               it under `## Needs follow-up`.
            7. Lint and test the changed files:
               - `uv run ruff check apps/ --fix`
               - `uv run ruff format apps/service_providers/ apps/cost_tracking/`
               - `uv run pytest apps/service_providers/tests/test_default_models.py -v`
               Lint/test any other files your migration touched.
            8. Commit the changes with a descriptive message.
            9. Push the branch and open a PR against `main` using the repo's PR
               template (`.github/pull_request_template.md`).
               - PR title: `Auto: update LLM model catalogue (YYYY-MM-DD)`
                 (today's UTC date).
               - The PR description MUST:
                 * List each added model with its `source_url`.
                 * Include the line: `Model metadata, pricing and token limits
                   from the
                   [LiteLLM price table](https://github.com/BerriAI/litellm/blob/main/model_prices_and_context_window.json).`
                 * Include a `## Needs follow-up` section for any unpriced
                   models, unpriced providers, or missing info.
                 * Check the "The migrations are backwards compatible" box -
                   `llm_model_migration()` is additive (only seeds new rows) so
                   these migrations are inherently backwards-compatible.
            10. Apply the `claude` and `auto-models` labels to the PR if they exist.
            11. A run can reach you with an empty `new_models` and a non-empty
                `deprecated_upstream` - the deprecation edits from step 4 are
                then the whole PR. If after review there is nothing to add and
                nothing to deprecate, do NOT open an empty PR - print a short
                summary to stdout and exit.
            12. ALWAYS write a decision report to `./decision_report.md` before
                exiting, regardless of outcome (PR opened, nothing to add, or
                partial). Use this exact structure:

                ```markdown
                # Auto Update Models - Decision Report

                **Run date (UTC):** <YYYY-MM-DD HH:MM>
                **Candidates considered:** <count>
                **Outcome:** <PR opened | Nothing to add | Error>
                **PR:** <PR URL if opened, else "n/a">

                ## Per-model decisions

                ### `<model-id>`
                - **Verdict:** Added | Skipped | Needs follow-up
                - **Mapped providers:** <e.g. openai, azure>  (if added)
                - **Pricing:** <litellm | partial | unpriced>  (name the
                  providers left unpriced, if any)
                - **Reason:** <one-sentence rationale - why added/skipped, or
                  what info was missing>
                - **Skip recorded:** <yes, in reconcile_ignored_models.json |
                  n/a>
                - **Source:** <source_url>

                <repeat for every model in new_models>

                ## Notes
                <any other context worth surfacing - sources consulted, edge
                cases, decisions deferred to follow-up, etc.>
                ```

                Every model in `new_models` MUST appear in the "Per-model
                decisions" section with an explicit verdict and reason. This
                file is the audit trail for the run.

            Branch: ${{ steps.branch.outputs.branch_name }} (already created and
            checked out).
          claude_args: |
            --allowedTools "Bash(uv run:*),Bash(uv sync:*),Bash(python manage.py:*),Bash(pnpm run lint:*),Bash(ls:*),Bash(cat:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git checkout:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(gh pr create:*),Bash(gh pr edit:*),Bash(gh label:*),Read,Write,Edit,Glob,Grep,WebFetch"

      - name: Append decision report to step summary
        if: always()
        run: |
          if [ -f decision_report.md ]; then
            cat decision_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# Auto Update Models - Decision Report"
              echo ""
              echo "**No decision report was produced.** Claude Code exited without"
              echo "writing \`decision_report.md\`. Check the Claude step logs above"
              echo "for what happened."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
