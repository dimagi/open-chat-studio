# Claude Followup Workflow
#
# Runs a single automatic follow-up pass on PRs from claude/** branches
# after their CI run completes: fixes CI failures and addresses actionable
# PR review feedback, then labels the PR claude-followup-done so it only
# runs once. Remove that label to allow another round.
#
# Triggered on: "Lint and Test" workflow completing on a claude/** branch
# Requirements: ANTHROPIC_API_KEY secret must be configured
#
# Notes:
# - Fork PRs are skipped — workflow_run grants this job write permissions
#   on the base repository, so it only acts on runs whose head branch
#   lives in this repo, never a fork's.
# - Runs are grouped per branch (`cancel-in-progress: false`), so a second
#   trigger for the same branch waits for the in-progress run to finish
#   rather than replacing it.

name: Claude Followup

on:
  workflow_run:
    workflows: ["Lint and Test"]
    types: [completed]
    branches:
      - 'claude/**'

concurrency:
  group: claude-followup-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

# Restrict default permissions — job overrides as needed
permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  check-and-fix:
    # workflow_run grants this job write permissions on the base repository, so
    # only act on runs whose head branch lives in this repo — never a fork's.
    if: github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      DJANGO_DATABASE_USER: postgres
      DJANGO_DATABASE_PASSWORD: postgres_password
      SECRET_KEY: secret-test-key
    steps:
      # Audit only: records egress without blocking. Flip to `block` plus an
      # `allowed-endpoints` list once the recorded traffic looks stable.
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Find PR and check for followup label
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed through the environment, never interpolated into the script
          # body: branch names and other payload values are untrusted input and
          # must not be parsed by bash.
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          echo "Head branch: $HEAD_BRANCH"
          echo "Run ID: $RUN_ID"
          echo "Run conclusion: $RUN_CONCLUSION"

          # Find the PR for this branch
          PR_NUMBER=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            echo "::notice::No open PR found for branch $HEAD_BRANCH"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "PR number: $PR_NUMBER"

          # Check if the followup label is already applied (one-round limit)
          HAS_LABEL=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name' | grep -c '^claude-followup-done$' || true)

          if [ "$HAS_LABEL" -gt 0 ]; then
            echo "::notice::PR #$PR_NUMBER already has claude-followup-done label, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "skip=false"
            echo "pr_number=$PR_NUMBER"
            echo "run_id=$RUN_ID"
            echo "run_conclusion=$RUN_CONCLUSION"
            echo "head_branch=$HEAD_BRANCH"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout PR branch
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.check.outputs.head_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up uv
        if: steps.check.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python dependencies
        if: steps.check.outputs.skip != 'true'
        run: |
          uv venv
          uv sync --locked --dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - uses: pnpm/action-setup@v6.0.9
        if: steps.check.outputs.skip != 'true'

      - name: Set up Node.js
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install Node dependencies
        if: steps.check.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run Claude Code
        if: steps.check.outputs.skip != 'true'
        id: claude
        uses: anthropics/claude-code-action@v1.0.206
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are following up on PR #${{ steps.check.outputs.pr_number }} to fix CI failures and address review feedback.

            ## CI Run Information
            - Run ID: ${{ steps.check.outputs.run_id }}
            - Conclusion: ${{ steps.check.outputs.run_conclusion }}

            ## Instructions

            ### Step 1: Gather feedback

            First, collect all feedback that needs to be addressed:

            **CI failures** (if conclusion is "failure"):
            Run `gh run view ${{ steps.check.outputs.run_id }} --log-failed` to see what failed.

            **PR review comments**:
            Run `gh pr view ${{ steps.check.outputs.pr_number }} --json reviews,comments` to see review-level comments.
            Run `gh api repos/${{ github.repository }}/pulls/${{ steps.check.outputs.pr_number }}/comments` to see inline code review comments.

            ### Step 2: Fix issues

            Address all actionable feedback:

            **For CI failures:**
            - Lint errors: run `ruff check --fix` and `ruff format` to fix Python issues
            - JS/TS lint: run `pnpm run lint` to check, fix issues manually
            - Python type errors: run `uv run ty check apps/` to check, fix issues manually
            - JS/TS type errors: run `pnpm run type-check` to check, fix issues manually
            - Test failures: read the failing test, understand the failure, fix the code or test
            - Lock file issues: run `uv lock` to regenerate

            **For review comments:**
            - Address actionable code review suggestions
            - Skip comments that are purely informational or questions
            - If a suggestion conflicts with project conventions, skip it

            ### Step 3: Verify fixes locally

            Run the checks locally to verify your fixes:
            - `ruff check && ruff format --check` (Python lint)
            - `uv run ty check apps/` (Python types)
            - `pnpm run build` (frontend build)
            - `pnpm run type-check` (TypeScript types)
            - `pytest path/to/relevant/tests.py -v` (relevant tests)

            ### Step 4: Push and comment

            If you made changes:
            1. Commit with a clear message describing what was fixed
            2. Push to the branch
            3. Comment on the PR summarizing what was fixed

            If CI passed and there are no actionable review comments:
            1. Comment on the PR noting that no changes were needed
          claude_args: '--allowedTools "Bash(pnpm run lint:*),Bash(pnpm run type-check:*),Bash(pnpm run build:*),Bash(pnpm run dev:*),Bash(pnpm install:*),Bash(ruff check:*),Bash(ruff format:*),Bash(ruff:*),Bash(ty check:*),Bash(ty:*),Bash(uv run ty:*),Bash(uv run ruff:*),Bash(uv run pytest:*),Bash(uv lock:*),Bash(pytest:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh run view:*),Bash(gh run download:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api:*),Read,Write,Edit"'

      - name: Add followup-done label
        if: always() && steps.check.outputs.skip != 'true' && steps.check.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.check.outputs.pr_number }}
        run: |
          gh pr edit "$PR_NUMBER" \
            --repo "$REPO" \
            --add-label "claude-followup-done"
