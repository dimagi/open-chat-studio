name: API Schema Dispatch

on:
  push:
    branches:
      - main
    paths:
      - 'api-schemas/**.yml'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch API Schema Update
    runs-on: ubuntu-latest

    steps:
      # Audit only: records egress without blocking. Flip to `block` plus an
      # `allowed-endpoints` list once the recorded traffic looks stable.
      - name: Harden the runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@v4.0.1
        with:
          token: ${{ secrets.OCS_DOCS_PAT }}
          repository: dimagi/open-chat-studio-docs
          event-type: ocs_api_update
          client-payload: |
            {
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "repository": "${{ github.repository }}",
              "timestamp": "${{ github.event.head_commit.timestamp }}"
            }
