name: Publish Package

on:
  push:
    tags:
      - 'w_v*'

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Audit only: records egress without blocking. Flip to `block` plus an
      # `allowed-endpoints` list once the recorded traffic looks stable.
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
          cache-dependency-path: components/chat_widget/pnpm-lock.yaml

      # Dependencies are managed with pnpm, but the package is published with npm
      # so it keeps using npm's OIDC trusted publishing (pnpm's OIDC support is incomplete).
      - name: Update npm
        run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
        working-directory: ./components/chat_widget
      - run: pnpm run build
        working-directory: ./components/chat_widget
      - run: npm publish
        working-directory: ./components/chat_widget
