- id: basic_hello_world
  input:
    query: "Write a function that returns 'Hello, World!'"
    context: ""
  checks:
    - type: syntax
    - type: has_main
    - type: code_node
    - type: execute
      input: "anything"
      expected: "Hello, World!"

- id: echo_input
  input:
    query: "Write a function that echoes back the user's input unchanged"
    context: ""
  checks:
    - type: syntax
    - type: has_main
    - type: code_node
    - type: execute
      input: "test input"
      expected: "test input"

- id: fix_syntax_error
  input:
    query: "Fix this code"
    context: "def main(input: str, **kwargs) -> str:\n    return input.upper("
  checks:
    - type: syntax
    - type: has_main
    - type: code_node
    - type: execute
      input: "hello"
      expected: "HELLO"

- id: use_participant_data
  input:
    query: "Write a function that reads the participant's name from participant data and greets them"
    context: ""
  checks:
    - type: syntax
    - type: has_main
    - type: code_node
    - type: llm_judge
      criteria: "The code calls get_participant_data() to read data and returns a greeting string that includes the participant's name"

- id: modify_existing_code
  input:
    query: "Add error handling so it returns 'Error' if the input is empty"
    context: "def main(input: str, **kwargs) -> str:\n    return input.upper()"
  checks:
    - type: syntax
    - type: has_main
    - type: code_node
    - type: execute
      input: ""
      expected: "Error"
    - type: execute
      input: "hello"
      expected: "HELLO"
    - type: llm_judge
      criteria: "The code preserves the original input.upper() logic and only adds the requested empty-input check, rather than restructuring or rewriting the function"

# The two cases below use the exact "Check for bugs" prompt from CHECK_FOR_BUGS_PROMPT in
# assets/javascript/apps/pipeline/nodes/widgets.tsx -- keep this text in sync with that constant.
- id: check_for_bugs_finds_and_fixes_a_real_bug
  input:
    query: >-
      Review this code for bugs, edge cases, and correctness issues. Fix any you find, making
      minimal changes. If there are no bugs, return the code unchanged.
    context: |-
      def main(input: str, **kwargs) -> str:
          numbers = [int(x) for x in input.split(",")]
          total = 0
          for n in numbers:
              total = n
          return str(total)
  checks:
    - type: syntax
    - type: has_main
    - type: code_node
    - type: execute
      input: "1,2,3"
      expected: "6"

- id: check_for_bugs_leaves_correct_code_unchanged
  input:
    query: >-
      Review this code for bugs, edge cases, and correctness issues. Fix any you find, making
      minimal changes. If there are no bugs, return the code unchanged.
    context: |-
      def main(input: str, **kwargs) -> str:
          return input.upper()
  checks:
    - type: syntax
    - type: has_main
    - type: code_node
    - type: execute
      input: "hello"
      expected: "HELLO"
    - type: llm_judge
      criteria: "The code is functionally equivalent to input.upper() and was not needlessly rewritten, since the original had no bugs"
