<div class="flex items-center gap-2">
  {% if record.kind == "invitation" %}
    <div class="avatar avatar-placeholder shrink-0">
      <div class="w-8 rounded-full border border-dashed border-neutral-400 text-neutral-400">
        <span class="text-xs font-bold">{{ record.initials }}</span>
      </div>
    </div>
  {% else %}
    <div class="avatar avatar-placeholder shrink-0">
      <div class="w-8 rounded-full bg-primary/10 text-primary">
        <span class="text-xs font-bold">{{ record.initials }}</span>
      </div>
    </div>
  {% endif %}
  <span class="min-w-0">
    <span class="block font-semibold truncate">{{ record.name }}</span>
    <span class="block text-neutral-500 text-xs truncate">{{ record.email }}</span>
  </span>
</div>
