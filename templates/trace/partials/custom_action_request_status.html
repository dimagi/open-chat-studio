{% if log.status_code is None %}
  <c-ui.badge variant="error" size="sm">Failed</c-ui.badge>
{% elif log.status_code >= 400 or log.error %}
  <c-ui.badge variant="error" size="sm">{{ log.status_code }}</c-ui.badge>
{% else %}
  <c-ui.badge variant="success" size="sm">{{ log.status_code }}</c-ui.badge>
{% endif %}
