{% comment %}
Help icon that shows the slot content on hover.

  <c-ui.help>Shown on hover. <b>HTML allowed.</b></c-ui.help>
{% endcomment %}
{% load i18n %}
<div {{ attrs|with_classes:"dropdown dropdown-right dropdown-hover" }}>
  <button
    type="button"
    class="btn btn-circle btn-ghost btn-xs text-info"
    aria-label="{% translate 'More information' %}">
    <i class="text-xs fa-regular fa-circle-question" aria-hidden="true"></i>
  </button>
  <div
    tabindex="0"
    class="card card-sm dropdown-content bg-slate-300 dark:bg-slate-700 rounded-box z-1 w-64 shadow-sm">
    <div tabindex="0" class="card-body font-medium text-wrap">
      <p>{{ slot }}</p>
    </div>
  </div>
</div>
