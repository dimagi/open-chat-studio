<button class="btn btn-sm join-item {{ button_style }}"
        {% if disabled %}disabled="disabled"{% endif %}
        id="action-{{ action_id }}"
        title="{{ title }}"
        type="button"
        onclick="document.getElementById('{{ modal_id }}').showModal()"
>
  {{ label }}
  {% if icon_class %}
    <i class="{{ icon_class }} htmx-hide"></i>
  {% endif %}
</button>
{% if modal_template %}
  {% include modal_template %}
{% else %}
  <c-ui.modal :id="modal_id" :title="modal_title">{{ modal_text }}</c-ui.modal>
{% endif %}
