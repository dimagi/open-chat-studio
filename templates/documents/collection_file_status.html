<div id="file-status-{{ collection_file.id }}"
{% comment %}
  `before:wrap-break-word` targets the tooltip body, which daisyUI renders as a ::before pseudo-element.
  It already wraps at 20rem but sets no word-breaking, so an unbroken token longer than that
  overflows the bubble -- and a provider error carrying a masked API key (sk-svcac****...im8A) is
  exactly such a token.
{% endcomment %}
     class="tooltip before:wrap-break-word{% if collection_file.failure_reason %} tooltip-error{% endif %}"
     data-tip="{{ collection_file.failure_reason|default:collection_file.status_enum.label }}"
     {% if collection_file.status == 'pending' or collection_file.status == 'in_progress' %}
       hx-get="{% url 'documents:get_collection_file_status' team.slug collection.id collection_file.id %}"
       hx-trigger="every 5s"
       hx-target="this"
       hx-swap="outerHTML"
     {% endif %}>
  {% if collection_file.status == 'pending' %}
    <div class="inline-grid *:[grid-area:1/1]">
      <div aria-label="pending" class="status animate-ping"></div>
      <div aria-label="pending" class="status"></div>
    </div>
  {% elif collection_file.status == 'in_progress' %}
    <span class="loading loading-spinner loading-xs"></span>
  {% elif collection_file.status == 'completed' %}
    <div aria-label="success" class="status status-success"></div>
  {% else %}
    <div aria-label="{{ collection_file.failure_reason|default:'error'|truncatechars:100 }}" class="status status-error"></div>
  {% endif %}
</div>
