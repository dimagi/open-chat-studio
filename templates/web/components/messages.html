<script>
  document.addEventListener('DOMContentLoaded', function(){
    document.body.addEventListener("djangoMessages", (event) => {
      event.detail.messages.forEach((message) => {
        alertify.notify(message.message, message.tags, 10);
      });
    })
  })
</script>
{% if messages %}
  <div>
    {% for message in messages %}
      <script>
        (() => {
          alertify.notify("{{ message.message|escapejs }}", "{{ message.tags|escapejs }}", 100);
        })();
      </script>
    {% endfor %}
  </div>
{% endif %}
