# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: true
reviews:
  high_level_summary: false
  review_status: false
  changed_files_summary: false
  collapse_walkthrough: true
  sequence_diagrams: false
  poem: false
  path_instructions:
    - path: "**"
      instructions: |
        Follow REVIEW.md. It defines what to flag and points at AGENTS.md "Invariants" and the per-path rule files in .opencodereview/rules/.
  auto_review:
    auto_incremental_review: false
    ignore_title_keywords:
      - wip
      - draft
      - ignore
    labels:
      - '!wip'
    drafts: true
    ignore_usernames:
      - dependabot
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
chat:
  auto_reply: false
knowledge_base:
  code_guidelines:
    filePatterns:
      - REVIEW.md
      - AGENTS.md
      - .opencodereview/rules/*.md
  issues:
    scope: local
  pull_requests:
    scope: local
