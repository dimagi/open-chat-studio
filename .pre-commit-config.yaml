exclude: ^static/.*|/migrations/.*|\.min\.js$|\.min\.css$|\.css\.map$|\.min\.js$|\.js\.map$|\.svg$
default_language_version:
  python: python3.13
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks  # Enables fast path
    rev: v6.0.0  # This is ignored for fast path detection
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-case-conflict
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: mixed-line-ending
      - id: check-symlinks
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: [--branch, main]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Scans the staged diff only, so a clean tree stays clean and no allowlist
      # is needed: the repo has zero hits in tracked files today. Local agent
      # config under .claude/ and .codex/ is gitignored, and this is the backstop
      # for when someone force-adds it anyway.
      - id: gitleaks
  - repo: https://github.com/adamchainz/djade-pre-commit
    rev: '1.9.0'
    hooks:
      - id: djade
        args: [--target-version, "5.1"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [ --fix, --show-fixes ]
      - id: ruff-format
  - repo: https://github.com/djlint/djLint
    rev: v1.43.2
    hooks:
#      - id: djlint-reformat-django enable once format changes have been applied
      - id: djlint-django
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: 'v10.8.0'
    hooks:
      - id: eslint
        # Keep these in sync with the matching devDependencies in package.json.
        additional_dependencies:
          - eslint@10.8.0
          - '@eslint/js@10.0.1'
          - typescript-eslint@8.65.0
        files: ^assets/javascript/.*\.[jt]sx?$  # *.js, *.jsx, *.ts and *.tsx
        types: [ file ]
        args: [ --fix ]
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: 'v3.9.6'
    hooks:
      - id: prettier
        files: ^components/chat_widget/src/.*\.(ts|tsx|css)$
        types: [ file ]
  - repo: https://github.com/allganize/ty-pre-commit
    # Ty version. Keep in sync with the `ty` entry in pyproject.toml's [dependency-groups.dev].
    rev: v0.0.65
    hooks:
      # Run the type checker.
      - id: ty-check
        # docs/plans/ contains design sketches, not runtime code.
        exclude: ^docs/plans/
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.yaml]
  - repo: local
    hooks:
      - id: waf-allow-not-first
        name: waf_allow must be the first decorator listed
        entry: scripts/waf_pre_commit.sh
        language: system
        pass_filenames: false
        always_run: true
        fail_fast: true
      - id: eslint-versions-in-sync
        name: eslint pins in .pre-commit-config.yaml must match pnpm-lock.yaml
        # package.json and .pre-commit-config.yaml are bumped by different
        # Dependabot ecosystems, so they drift apart silently.
        entry: python scripts/check_eslint_versions.py
        language: python
        additional_dependencies: [pyyaml]
        pass_filenames: false
        files: ^(\.pre-commit-config\.yaml|package\.json|pnpm-lock\.yaml)$
      - id: atomic-exception-handling
        name: database exceptions must not be caught inside transaction.atomic()
        # Stdlib-only AST check, so it needs no virtualenv of its own. The repo-wide
        # gate lives in scripts/test_check_atomic_exception_handling.py; this hook is
        # the fast signal on the files a commit or PR actually touches.
        entry: python3 scripts/check_atomic_exception_handling.py apps --files
        language: system
        files: ^apps/.*\.py$
        exclude: /migrations/
